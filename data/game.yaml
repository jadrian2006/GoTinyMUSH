# game.yaml - GoTinyMUSH Example Configuration
#
# Usage: gotinymush -conf data/game.yaml -db <flatfile> [-bolt <boltfile>]

# --- Identity ---
mud_name: GoTinyMUSH
port: 6250

# --- Key Rooms ---
master_room: 2
player_starting_room: 0
player_starting_home: 0
default_home: 0

# --- Economy ---
money_name_singular: penny
money_name_plural: pennies
starting_money: 150
paycheck: 50
earn_limit: 10000
page_cost: 0
wait_cost: 10
link_cost: 1

# --- Idle/Timeout ---
idle_timeout: 3600       # 1 hour
idle_wiz_dark: false

# --- Queue/Eval ---
queue_idle_chunk: 3
function_invocation_limit: 2500
machine_command_cost: 64

# --- Output ---
output_limit: 16384

# --- Permissions ---
match_own_commands: false
player_match_own_commands: false
pemit_far_players: false
pemit_any_object: false
examine_public_attrs: true
public_flags: true
read_remote_name: false
require_cmds_flag: true
switch_default_all: true
sweep_dark: false
trace_topdown: true
trace_output_limit: 200

# --- Guest ---
guest_char_num: -1
# guest_prefixes: "Red Blue Green Yellow White"
# guest_suffixes: "_Guest"
guest_basename: Guest

# --- Channels ---
public_channel: Public
public_calias: pub
guests_channel: Public
guests_calias: pub

# --- Module Toggles ---
mail_enabled: false           # Built-in mail system (set false if using softcode mail)
comsys_enabled: true          # Channel/comsys system
spellcheck_enabled: false     # Spellcheck via LanguageTool API
# spellcheck_url: "https://api.languagetool.org/v2/check"

# --- Feature Toggles ---
hooks_enabled: true              # @hook command pre/post/override system
instances_enabled: true          # @instance vehicle/container system
sensory_enabled: true            # smell/touch/taste/listen commands
roomformat_enabled: true         # @roomformat custom room rendering
multizone_enabled: true          # @chzone/add, @chzone/remove, zones()
mogrifier_enabled: true          # Channel message mogrifiers

# --- SQL ---
sql_enabled: false            # SQLite3 database for sql() function
# sql_database: data/game.sqlite3
# sql_query_limit: 100
# sql_timeout: 5

# --- Archive/Backup ---
# archive_dir: backups
# archive_interval: 0        # minutes, 0 = disabled
# archive_retain: 0           # 0 = unlimited
# archive_hook: ""             # shell command, %f = archive path

# --- Web Server ---
web_enabled: true
web_port: 8443
# web_client_url: "http://web-client:80"  # Set if using separate web client container
# web_cors_origins: []
# web_rate_limit: 60
# jwt_expiry: 86400

# --- TLS ---
# cleartext: true
# tls: false
# tls_port: 6251
# tls_cert: data/cert.pem
# tls_key: data/key.pem

# --- Alias Configuration Files ---
# Paths are relative to this config file's directory.
alias_files:
  - goTinyAlias.conf
